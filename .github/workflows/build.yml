name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: zsh -n scripts/*.sh
      - name: Validate property lists
        run: plutil -lint macos/*.plist
      - name: Build release executable
        run: swift build -c release
